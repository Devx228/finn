# One research job, started by the API (finn/jobs.py github_dispatch) when no laptop worker is
# online. The job row says which symbol; this run only claims it, so a dispatch can't name an
# arbitrary command or ticker. NSE access follows the same rules as the laptop (sources/http.py):
# one request at a time, >= 1.2 s apart, cached, and a refusal is recorded permanently in
# `source_blocks` so FINN never sends work to GitHub again for that source.
name: research
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: research_jobs.id
        required: true

concurrency:
  group: research-${{ inputs.job_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      FINN_ENV: github
      JOB_ID: ${{ inputs.job_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      # documents fetched by earlier runs: never fetch the same document twice
      - uses: actions/cache@v4
        with:
          path: data/cache/http
          key: nse-http-${{ github.run_id }}
          restore-keys: nse-http-
      - run: pip install -e ./api
      - name: Run the job
        run: |
          case "$JOB_ID" in ''|*[!0-9]*) echo "job_id must be a number"; exit 1;; esac
          if [ -z "$DATABASE_URL" ]; then echo "DATABASE_URL secret is empty: the job can't be claimed or reported"; exit 1; fi
          finn worker --job "$JOB_ID"
