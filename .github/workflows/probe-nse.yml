# TEMPORARY (Phase 1 probe 4): does NSE answer a GitHub-hosted runner? One plain request,
# no retries, no cookies. Removed after the result is recorded in DECISIONS.md.
name: probe-nse
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: One NSE announcements request
        run: |
          curl -sS -o body.json -w "status=%{http_code} bytes=%{size_download} time=%{time_total}s\n" \
            -A "FINN-prototype/0.1" --max-time 30 \
            "https://www.nseindia.com/api/corporate-announcements?index=equities&symbol=INFY&from_date=01-11-2026&to_date=12-11-2026" || true
          head -c 200 body.json || true; echo
          echo "runner ip: $(curl -s --max-time 10 https://api.ipify.org || echo unknown)"
