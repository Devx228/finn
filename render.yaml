# Render Blueprint for the FINN API (free plan, Docker). Secrets are entered in the Render
# dashboard (sync: false) and never committed.
services:
  - type: web
    name: finn-api
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./api
    dockerfilePath: ./api/Dockerfile
    healthCheckPath: /livez
    autoDeployTrigger: commit
    envVars:
      - key: FINN_ENV
        value: render
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
